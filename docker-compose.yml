# Stack "cards-admin" para Portainer (EDOMEXBOT)
# Cómo usarlo: Portainer → Stacks → Add stack → pega este archivo
# (o súbelo a un repo y usa Git). Nombre del stack: cards-admin
services:
  cards-admin:
    build: .
    # Si en Portainer usas "Repository" en vez de build, quita build: .
    # y pon: image: cards-admin:latest
    container_name: cards-admin
    restart: unless-stopped
    ports:
      # El puerto 3000 queda expuesto en el host; el túnel de Cloudflare
      # es quien lo publica (ver README). Si prefieres no exponerlo en
      # el host, cambia "3000:3000" por solo "3000".
      - "3000:3000"
    environment:
      # --- OBLIGATORIO: se toman de las Environment variables del stack en Portainer ---
      # En Portainer define ADMIN_PASSWORD y API_KEY (no los escribas aquí).
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY=${API_KEY}
      # --- Postgres ---
      # Sin DATABASE_URL la app usa JSON en /data y funciona igual.
      # Para usar Postgres real (una BD separada de la de Evolution):
      # 1) En Portainer define la variable DATABASE_URL con el valor:
      #      postgres://USUARIO:CONTRASENA@postgres_evo:5432/cards_admin
      #    (usuario y contraseña de postgres_evo, del stack whatsapp-bot;
      #    la BD "cards_admin" la crea el script de migración).
      # 2) Antes del primer arranque con DATABASE_URL, corre la migración
      #    del JSON existente (ver README, sección "Migrar de JSON a
      #    Postgres") o arranca con la BD vacía y se siembra sola.
      # DATABASE_URL nunca va quemado aquí: viene de las Environment
      # variables del stack en Portainer.
      - DATABASE_URL=${DATABASE_URL:-}
      - DATA_DIR=/data
      - PORT=3000
    volumes:
      - cards-admin-data:/data
    networks:
      # Se une a las dos redes que ya existen, para poder hablar
      # con postgres_evo (whatsapp-bot_default) y con n8n si hace falta.
      - whatsapp-bot_default
      - n8n_default

networks:
  whatsapp-bot_default:
    external: true
  n8n_default:
    external: true

volumes:
  cards-admin-data:
