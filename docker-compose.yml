# Stack "cards-admin" para Portainer (EDOMEXBOT)
# Cómo usarlo: Portainer → Stacks → Add stack → pega este archivo
# (o súbelo a un repo y usa Git). Nombre del stack: cards-admin
services:
  cards-admin:
    build: .
    # Si en Portainer usas "Repository" en vez de build, quita build: .
    # y pon: image: cards-admin:latest
    container_name: cards-admin
    restart: unless-stopped
    ports:
      # El puerto 3000 queda expuesto en el host; el túnel de Cloudflare
      # es quien lo publica (ver README). Si prefieres no exponerlo en
      # el host, cambia "3000:3000" por solo "3000".
      - "3000:3000"
    environment:
      # --- OBLIGATORIO: cámbialos antes de desplegar ---
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=cambia-esta-contrasena
      - API_KEY=cambia-esta-api-key
      # --- Postgres (opcional al inicio) ---
      # Sin DATABASE_URL la app usa JSON en /data y funciona igual.
      # Para usar el Postgres que ya tienes (postgres_evo):
      # 1) En Portainer abre el stack whatsapp-bot y copia de su
      #    configuración el usuario, la contraseña y el nombre de la
      #    base de datos de postgres_evo. NO están en este archivo.
      # 2) Descomenta la línea y rellénala con esos datos reales:
      # - DATABASE_URL=postgres://USUARIO:CONTRASENA@postgres_evo:5432/NOMBRE_DB
      # 3) Reinicia el stack. La app crea las tablas sola (schema.sql).
      - DATA_DIR=/data
      - PORT=3000
    volumes:
      - cards-admin-data:/data
    networks:
      # Se une a las dos redes que ya existen, para poder hablar
      # con postgres_evo (whatsapp-bot_default) y con n8n si hace falta.
      - whatsapp-bot_default
      - n8n_default

networks:
  whatsapp-bot_default:
    external: true
  n8n_default:
    external: true

volumes:
  cards-admin-data:
